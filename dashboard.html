<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Temperature dashboard</title>
<style>
  :root {
    --surface: #ffffff;
    --ink: #1d1f24;
    --muted: #6b7079;
    --grid: #e4e6ea;
    --line: #1f6fb4;
    --area: rgba(31, 111, 180, 0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #16181d;
      --ink: #e8eaee;
      --muted: #9aa0aa;
      --grid: #2c3038;
      --line: #6aa9e8;
      --area: rgba(106, 169, 232, 0.15);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--surface);
    color: var(--ink);
  }
  main { max-width: 960px; margin: 0 auto; }
  header {
    display: flex; flex-wrap: wrap; gap: 16px;
    align-items: flex-end; justify-content: space-between;
    margin-bottom: 16px;
  }
  h1 { font-size: 20px; margin: 0; font-weight: 600; }
  .muted { color: var(--muted); font-size: 13px; }
  .tiles { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 16px; }
  .tile { border: 1px solid var(--grid); border-radius: 8px; padding: 12px 16px; min-width: 160px; flex: 1; }
  .tile .value { font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .controls button {
    font: inherit; color: var(--ink); background: none;
    border: 1px solid var(--grid); border-radius: 6px;
    padding: 4px 10px; margin-left: 4px; cursor: pointer;
  }
  .controls button[aria-pressed="true"] { border-color: var(--line); color: var(--line); font-weight: 600; }
  .chart { position: relative; border: 1px solid var(--grid); border-radius: 8px; padding: 8px; }
  svg { width: 100%; height: auto; display: block; }
  .tooltip {
    position: absolute; pointer-events: none; display: none;
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--grid); border-radius: 6px;
    padding: 6px 8px; font-size: 13px; white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  details { margin-top: 16px; }
  summary { cursor: pointer; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; margin-top: 8px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Temperature</h1>
      <div class="muted" id="status">Loading…</div>
    </div>
    <div class="controls" role="group" aria-label="Time range">
      <button type="button" data-hours="1" aria-pressed="false">1 h</button>
      <button type="button" data-hours="24" aria-pressed="true">24 h</button>
      <button type="button" data-hours="168" aria-pressed="false">7 d</button>
      <button type="button" data-hours="0" aria-pressed="false">All</button>
    </div>
  </header>

  <section class="tiles">
    <div class="tile"><div class="muted">Latest</div><div class="value" id="latest">–</div><div class="muted" id="latestTime"></div></div>
    <div class="tile"><div class="muted">Min</div><div class="value" id="min">–</div></div>
    <div class="tile"><div class="muted">Max</div><div class="value" id="max">–</div></div>
    <div class="tile"><div class="muted">Average</div><div class="value" id="avg">–</div></div>
  </section>

  <div class="chart" id="chart">
    <svg id="plot" viewBox="0 0 800 320" role="img" aria-labelledby="chartTitle">
      <title id="chartTitle">Temperature over time</title>
    </svg>
    <div class="tooltip" id="tip"></div>
  </div>

  <details>
    <summary>Table of readings</summary>
    <table>
      <thead><tr><th>Measured</th><th>Device</th><th>°C</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </details>
</main>

<script>
const W = 800, H = 320;
const PAD = { l: 52, r: 16, t: 16, b: 32 };
const NS = "http://www.w3.org/2000/svg";

let hours = 24;
let data = [];
let chartState = null;

const $ = (id) => document.getElementById(id);
const fmt = (v) => (v == null ? "–" : v.toFixed(1) + " °C");

function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}

async function load() {
  try {
    const r = await fetch("/readings?limit=1000", { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const rows = await r.json();
    data = rows
      .map((d) => ({ t: Date.parse(d.measured_at), v: d.temperature_c, device: d.device }))
      .filter((d) => !isNaN(d.t))
      .sort((a, b) => a.t - b.t);
    $("status").textContent = "Updated " + new Date().toLocaleTimeString();
  } catch (e) {
    $("status").textContent = "Could not load readings: " + e.message;
  }
  render();
}

function visible() {
  if (!hours) return data;
  const cutoff = Date.now() - hours * 3600e3;
  return data.filter((d) => d.t >= cutoff);
}

function render() {
  const pts = visible();
  if (pts.length) {
    const vals = pts.map((p) => p.v);
    const last = pts[pts.length - 1];
    $("latest").textContent = fmt(last.v);
    $("latestTime").textContent = new Date(last.t).toLocaleString();
    $("min").textContent = fmt(Math.min(...vals));
    $("max").textContent = fmt(Math.max(...vals));
    $("avg").textContent = fmt(vals.reduce((a, b) => a + b, 0) / vals.length);
  } else {
    for (const id of ["latest", "min", "max", "avg"]) $(id).textContent = "–";
    $("latestTime").textContent = "";
  }
  drawChart(pts);
  drawTable(pts);
}

function drawChart(pts) {
  const svg = $("plot");
  svg.innerHTML = "";
  el("title", { id: "chartTitle" }, svg).textContent = "Temperature over time";
  chartState = null;
  $("tip").style.display = "none";

  if (!pts.length) {
    const t = el("text", { x: W / 2, y: H / 2, "text-anchor": "middle", fill: "var(--muted)", "font-size": 14 }, svg);
    t.textContent = "No readings in this range";
    return;
  }

  const x0 = pts[0].t;
  const span = Math.max(pts[pts.length - 1].t - x0, 1);
  let lo = Math.min(...pts.map((p) => p.v));
  let hi = Math.max(...pts.map((p) => p.v));
  if (hi - lo < 2) { const mid = (hi + lo) / 2; lo = mid - 1; hi = mid + 1; }
  lo = Math.floor(lo - 0.5);
  hi = Math.ceil(hi + 0.5);

  const plotW = W - PAD.l - PAD.r;
  const plotH = H - PAD.t - PAD.b;
  const xOf = (t) => PAD.l + ((t - x0) / span) * plotW;
  const yOf = (v) => PAD.t + (1 - (v - lo) / (hi - lo)) * plotH;

  // Recessive grid and y-axis labels
  const steps = 4;
  for (let i = 0; i <= steps; i++) {
    const v = lo + ((hi - lo) * i) / steps;
    const y = yOf(v);
    el("line", { x1: PAD.l, x2: W - PAD.r, y1: y, y2: y, stroke: "var(--grid)", "stroke-width": 1 }, svg);
    const t = el("text", { x: PAD.l - 8, y: y + 4, "text-anchor": "end", fill: "var(--muted)", "font-size": 12 }, svg);
    t.textContent = v.toFixed(0) + "°";
  }

  // X-axis labels
  const longRange = span > 24 * 3600e3;
  for (let i = 0; i <= 3; i++) {
    const t = x0 + (span * i) / 3;
    const label = new Date(t).toLocaleString([], longRange
      ? { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }
      : { hour: "2-digit", minute: "2-digit" });
    const anchor = i === 0 ? "start" : i === 3 ? "end" : "middle";
    const tx = el("text", { x: xOf(t), y: H - 8, "text-anchor": anchor, fill: "var(--muted)", "font-size": 12 }, svg);
    tx.textContent = label;
  }

  // Area and line (2px line, no markers on every point)
  const coords = pts.map((p) => [xOf(p.t), yOf(p.v)]);
  const linePath = coords.map((c, i) => (i ? "L" : "M") + c[0].toFixed(1) + " " + c[1].toFixed(1)).join(" ");
  const baseY = PAD.t + plotH;
  el("path", {
    d: linePath + ` L${coords[coords.length - 1][0].toFixed(1)} ${baseY} L${coords[0][0].toFixed(1)} ${baseY} Z`,
    fill: "var(--area)", stroke: "none",
  }, svg);
  el("path", { d: linePath, fill: "none", stroke: "var(--line)", "stroke-width": 2, "stroke-linejoin": "round" }, svg);

  // Hover layer: crosshair and marker
  const cross = el("line", { y1: PAD.t, y2: baseY, stroke: "var(--muted)", "stroke-width": 1, "stroke-dasharray": "3 3", visibility: "hidden" }, svg);
  const dot = el("circle", { r: 4, fill: "var(--line)", stroke: "var(--surface)", "stroke-width": 2, visibility: "hidden" }, svg);
  const overlay = el("rect", { x: PAD.l, y: PAD.t, width: plotW, height: plotH, fill: "transparent" }, svg);

  chartState = { pts, x0, span, xOf, yOf, cross, dot };

  overlay.addEventListener("mousemove", (e) => {
    const rect = svg.getBoundingClientRect();
    const sx = ((e.clientX - rect.left) / rect.width) * W;
    const t = x0 + ((sx - PAD.l) / plotW) * span;
    let best = 0;
    for (let i = 1; i < pts.length; i++) {
      if (Math.abs(pts[i].t - t) < Math.abs(pts[best].t - t)) best = i;
    }
    const p = pts[best];
    const cx = xOf(p.t), cy = yOf(p.v);
    cross.setAttribute("x1", cx); cross.setAttribute("x2", cx); cross.setAttribute("visibility", "visible");
    dot.setAttribute("cx", cx); dot.setAttribute("cy", cy); dot.setAttribute("visibility", "visible");

    const tip = $("tip");
    tip.innerHTML = "";
    const a = document.createElement("div");
    a.textContent = p.v.toFixed(1) + " °C";
    a.style.fontWeight = "600";
    const b = document.createElement("div");
    b.className = "muted";
    b.textContent = new Date(p.t).toLocaleString() + (p.device ? " · " + p.device : "");
    tip.append(a, b);
    tip.style.display = "block";
    const chartRect = $("chart").getBoundingClientRect();
    const left = e.clientX - chartRect.left + 12;
    tip.style.left = Math.min(left, chartRect.width - tip.offsetWidth - 8) + "px";
    tip.style.top = "8px";
  });
  overlay.addEventListener("mouseleave", () => {
    cross.setAttribute("visibility", "hidden");
    dot.setAttribute("visibility", "hidden");
    $("tip").style.display = "none";
  });
}

function drawTable(pts) {
  const body = $("rows");
  body.innerHTML = "";
  const recent = pts.slice(-200).reverse();
  for (const p of recent) {
    const tr = document.createElement("tr");
    [new Date(p.t).toLocaleString(), p.device || "", p.v.toFixed(2)].forEach((text) => {
      const td = document.createElement("td");
      td.textContent = text;
      tr.appendChild(td);
    });
    body.appendChild(tr);
  }
}

document.querySelectorAll(".controls button").forEach((btn) => {
  btn.addEventListener("click", () => {
    hours = Number(btn.dataset.hours);
    document.querySelectorAll(".controls button").forEach((b) =>
      b.setAttribute("aria-pressed", b === btn ? "true" : "false"));
    render();
  });
});

load();
setInterval(load, 30000);
</script>
</body>
</html>
